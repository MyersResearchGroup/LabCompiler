[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lab-compiler"
dynamic = ["version"]
description = "A small Python compiler for inspectable laboratory protocols"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["laboratory", "automation", "compiler", "protocols"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pint>=0.24,<0.27",
    "sbol3==1.2.0.post0",
]

[project.urls]
Homepage = "https://github.com/the-lab-compiler/lab-py"
Documentation = "https://github.com/the-lab-compiler/lab-py#readme"
Repository = "https://github.com/the-lab-compiler/lab-py"
Issues = "https://github.com/the-lab-compiler/lab-py/issues"

[project.optional-dependencies]
opentrons = ["opentrons==8.8.2"]
star = ["pylabrobot==0.2.1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "xlsxwriter>=3.2.9",
    "twine>=6.2,<7",
]

[tool.hatch.version]
path = "src/lab/_version.py"

[tool.hatch.build.targets.sdist]
# Keep artifacts compatible with the publishing toolchain's metadata validator.
core-metadata-version = "2.4"
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/integrations",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC0415", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires the optional robot SDKs; never connects to hardware"]

[tool.mypy]
files = ["src/lab", "integrations/labop"]
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["opentrons.*", "pylabrobot.*", "sbol3.*", "labop.*", "uml.*"]
ignore_missing_imports = true
